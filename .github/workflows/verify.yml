name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / JDK 17
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: "**/pom.xml"
      - name: Verify STDIO service
        working-directory: weka-mcp-java
        run: mvn -B -ntp clean verify
      - name: Verify native Weka package on Linux
        if: runner.os == 'Linux'
        working-directory: weka-gui-plugin
        run: xvfb-run -a mvn -B -ntp clean verify
      - name: Verify native Weka package on macOS and Windows
        if: runner.os != 'Linux'
        working-directory: weka-gui-plugin
        run: mvn -B -ntp clean verify
      - name: Upload Weka package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: weka-mcp-${{ matrix.os }}
          path: |
            weka-mcp-java/target/weka-mcp-java-1.6.0.jar
            weka-gui-plugin/target/weka-mcp-gui-0.8.0.zip
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            weka-mcp-java/target/surefire-reports/
            weka-mcp-java/target/failsafe-reports/
            weka-gui-plugin/target/surefire-reports/
            weka-gui-plugin/target/failsafe-reports/
          if-no-files-found: warn
